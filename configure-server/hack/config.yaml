# CLI tool, only in development environment.
# https://goframe.org/docs/cli
gfcli:
  gen:
    dao:
      #  - link: "pgsql:postgres:123456@tcp(127.0.0.1:5433)/app_db"
      - link: "dm:CONFIG_CENTER:ConfigCenter_123@tcp(127.0.0.1:5236)/CONFIG_CENTER"
        descriptionTag: true
        tables: "CONFIG_HISTORY,DEPLOY_NODES,DEPLOY_ARTIFACTS,DEPLOY_JOBS"
        jsonCase: "Snake"

  build:
    name:     "main"
    arch:     "amd64"
    system:   "linux"
    mod:      "none"
    path:     "./bin"
    packSrc:  "manifest/config"
    extra:    "-buildvcs=false"

  docker:
    build: "-a amd64 -s linux -p temp -ew"
    tagPrefixes:
      - my.image.pub/configure-server
