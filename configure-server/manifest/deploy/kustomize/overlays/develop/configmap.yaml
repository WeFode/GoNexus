apiVersion: v1
kind: ConfigMap
metadata:
  name: configure-server-configmap
data:
  config.yaml: |
    server:
      address:     ":9000"
      openapiPath: "/api.json"
      swaggerPath: "/swagger"

    logger:
      level : "all"
      stdout: true

    svc:
      etcd:
        host: "etcd:2379"
        seedDir: "manifest/etcd-seed"
